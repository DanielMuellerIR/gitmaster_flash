name: Checks

on: [push, pull_request]

permissions:
  contents: read

env:
  TERM: xterm-256color
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
        python: ["3.9", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish shellcheck
      - if: runner.os == 'macOS'
        run: brew install fish shellcheck
      - name: Check shell entry points
        run: |
          shellcheck install.sh install-linux.sh
          for script in build.sh release.sh gmf.zsh tools/check-zshrc.zsh; do
            zsh -n "$script"
          done
      - run: ./build.sh --check
