[project]
name = "gitmaster-flash"
dynamic = ["version"]
requires-python = ">=3.9"
dependencies = []

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.9"
files = ["gitmaster_flash.py", "tools", "docs/make-screens.py"]
incremental = false
